[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Real estate market agent: tracks the U.S. housing market nationally and across the 50 largest metros."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "anthropic>=0.36",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
