[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Real estate market agent: tracks the U.S. housing market nationally and across the 50 largest metros."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agents-core",
    "httpx>=0.27",
    "pillow>=11",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pydantic>=2.8",
]

[project.entry-points."agents_core.agents"]
real_estate = "agents.real_estate.agent:AGENT"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pyyaml>=6.0.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv.sources]
agents-core = { git = "https://github.com/Kghaffari26/agents-core", rev = "9e4f342a06b4e74bb27d73cf759e931033fa97bf" }
