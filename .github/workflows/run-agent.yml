name: Run agent (reusable)

# Callable from any repo that installs agents-core:
#
#   jobs:
#     run:
#       uses: Kghaffari26/real-estate-agent/.github/workflows/run-agent.yml@v0.1.0
#       with:
#         agent: real_estate
#         max_run_usd: "0.50"
#       secrets: inherit
#
# It runs `uv run agents-run <agent>` in the calling repo's own checkout,
# commits data/ (the agent's committed state/cache, per SPEC_REAL_ESTATE.md
# §4) to main, force-pushes public-data/ plus any exported JSON Schemas to
# a `data` branch (so a website can pull just that, without the repo's
# Python source or history), and — only if SITE_DISPATCH_TOKEN is set —
# notifies the website repo via repository_dispatch. Nothing here is
# specific to any one agent.

on:
  workflow_call:
    inputs:
      agent:
        description: "Registered agent name (agents_core.agents entry point)"
        required: true
        type: string
      extra_args:
        description: "Extra CLI args forwarded verbatim to `agents-run <agent>`"
        required: false
        type: string
        default: ""
      max_run_usd:
        description: "MAX_RUN_USD env var for the run"
        required: false
        type: string
        default: "0.50"
      site_repo:
        description: "owner/repo to notify via repository_dispatch on publish. Empty skips notification."
        required: false
        type: string
        default: ""
      data_branch:
        description: "Branch to force-push public-data/ and schemas/ to"
        required: false
        type: string
        default: "data"
    secrets:
      SITE_DISPATCH_TOKEN:
        description: "Token with contents:write on site_repo. Notification is skipped quietly if unset."
        required: false
      ANTHROPIC_API_KEY:
        required: false
      FRED_API_KEY:
        required: false
      CENSUS_API_KEY:
        required: false

concurrency:
  group: agents-data-push-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAX_RUN_USD: ${{ inputs.max_run_usd }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run agent
        run: uv run agents-run "${{ inputs.agent }}" ${{ inputs.extra_args }}

      - name: Export JSON Schemas
        run: |
          mkdir -p schemas
          shopt -s nullglob
          scripts=(scripts/export_*schema*.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no scripts/export_*schema*.py found; skipping schema export"
          else
            for script in "${scripts[@]}"; do
              uv run python "$script"
            done
          fi
        continue-on-error: true

      - name: Commit data/ and schemas/ to main
        run: |
          git config user.name "agents-bot"
          git config user.email "agents-bot@users.noreply.github.com"
          git add data/
          [ -d schemas ] && git add schemas/
          if git diff --cached --quiet; then
            echo "no data/ or schemas/ changes to commit"
          else
            git commit -m "chore(${{ inputs.agent }}): update data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish public-data/ + schemas/ to the data branch
        run: |
          git config user.name "agents-bot"
          git config user.email "agents-bot@users.noreply.github.com"

          rm -rf /tmp/data-branch
          if git ls-remote --exit-code --heads origin "${{ inputs.data_branch }}" >/dev/null 2>&1; then
            git fetch origin "${{ inputs.data_branch }}"
            git worktree add /tmp/data-branch "origin/${{ inputs.data_branch }}"
            git -C /tmp/data-branch switch -c "${{ inputs.data_branch }}"
          else
            git worktree add --detach /tmp/data-branch
            git -C /tmp/data-branch checkout --orphan "${{ inputs.data_branch }}"
            git -C /tmp/data-branch rm -rf . >/dev/null 2>&1 || true
          fi

          rsync -a --delete public-data/ /tmp/data-branch/public-data/ 2>/dev/null || true
          rsync -a --delete schemas/ /tmp/data-branch/schemas/ 2>/dev/null || true

          cd /tmp/data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "no published-data changes"
          else
            git commit -m "chore(${{ inputs.agent }}): publish data [skip ci]"
            git push origin "HEAD:${{ inputs.data_branch }}" --force
          fi

      - name: Notify website repo
        if: ${{ inputs.site_repo != '' && secrets.SITE_DISPATCH_TOKEN != '' }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: token ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.site_repo }}/dispatches" \
            -d "$(jq -nc --arg agent "${{ inputs.agent }}" --arg repo "${{ github.repository }}" \
                  '{event_type:"agent-data-updated", client_payload:{agent:$agent, repo:$repo}}')"

      - name: Skip notification (no site_repo or token configured)
        if: ${{ inputs.site_repo == '' || secrets.SITE_DISPATCH_TOKEN == '' }}
        run: |
          echo "Skipping repository_dispatch: site_repo or SITE_DISPATCH_TOKEN not set."
