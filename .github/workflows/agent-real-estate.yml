name: real_estate agent

# Weekly run (SPEC_REAL_ESTATE.md §9) through agents-core's reusable workflow:
# it runs `agents-run real_estate`, commits data/ (cost log, guard failures,
# data/real_estate/ state + brief cache) back to this branch, and force-pushes
# public-data/ to this repo's `data` branch (the agents-core data-branch contract).
on:
  schedule:
    - cron: "0 15 * * 5" # Friday 08:00 PT, after Thursday's Freddie Mac rate release
  workflow_dispatch:
    inputs:
      force_briefs:
        description: "Regenerate every brief regardless of cached facts hashes"
        required: false
        type: boolean
        default: false

jobs:
  run:
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.1.0
    with:
      agent: real_estate
      extra_args: ${{ inputs.force_briefs && '--force-briefs' || '' }}
      max_run_usd: "0.50"
      site_repo: Kghaffari26/agents-hub
      cache_path: data/cache/real_estate
    secrets: inherit
