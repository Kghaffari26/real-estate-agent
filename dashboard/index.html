<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="U.S. housing market dashboard: 50 metros, national trends, mortgage rates." />
    <title>Housing Market Dashboard</title>
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('re-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
