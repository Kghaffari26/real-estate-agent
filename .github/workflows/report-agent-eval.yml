name: report-agent-eval

# The live eval of the Listing Prep report agent (evals/listing_prep/suites.py:
# REPORT_AGENT): six fictional fixture properties through the real loop, reviewer and
# judge, capped at $2.50. It saves each loop's trajectory and the reviewer's responses
# (LP_SAVE_TRAJECTORIES) and uploads them, with the eval's history line and results, as
# the `report-agent-eval` artifact. Commit the trajectories to
# evals/listing_prep/trajectories/ and tests/test_listing_prep_report.py replays them offline.
#
# Started by hand: "Run workflow" (workflow_dispatch; needs this file on the default
# branch), or by adding the `live-eval` label to a pull request from this repository
# (works before the merge). Forks never get the key: pull_request runs from forks have
# no secrets, and the label job only runs for branches of this repository.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: report-agent-eval
  cancel-in-progress: false

jobs:
  eval:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'live-eval' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: REPORT_AGENT (live, at most $2.50)
        run: uv run agents-evals run evals.listing_prep.suites:REPORT_AGENT --max-usd 2.50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_SAVE_TRAJECTORIES: evals/listing_prep/trajectories
          AGENTS_CORE_DATA_DIR: ${{ runner.temp }}/agents-data
      - name: Upload the recordings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-agent-eval
          path: |
            evals/listing_prep/trajectories/
            evals/history.jsonl
            evals/results/
          if-no-files-found: warn
          retention-days: 30
