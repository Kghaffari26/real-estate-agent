name: Evals

# The eval gate on pull requests (agents-core's run-evals.yml v0.3.2, pinned by commit
# SHA 9e4f342 until the v0.3.2 tag exists): runs the
# suites in evals/real_estate/suites.py and the Listing Prep report template suite
# (evals/listing_prep/suites.py, free; its live REPORT_AGENT suite costs ~$2 and is
# run by hand after report prompt or tool changes), appends to evals/history.jsonl, compares
# each suite with the committed baseline (the previous history line) and fails on a
# score drop of more than regression_threshold. max_usd caps each suite's spend
# (AGENTS_CORE_EVAL_MAX_USD) and total_max_usd the whole run across suites
# (AGENTS_CORE_EVAL_TOTAL_MAX_USD, v0.3.1+); a full run costs about $0.16.
on:
  pull_request:
    paths:
      - "agents/**"
      - "evals/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  evals:
    # run-evals.yml declares no permissions of its own; it only needs to check out.
    permissions:
      contents: read
    # agents-core v0.3.2 by commit SHA (the tag doesn't exist yet).
    uses: Kghaffari26/agents-core/.github/workflows/run-evals.yml@9e4f342a06b4e74bb27d73cf759e931033fa97bf
    with:
      eval_command: >-
        uv run agents-evals run
        evals.real_estate.suites:TEMPLATE_BRIEFS
        evals.real_estate.suites:LLM_BRIEFS
        evals.real_estate.suites:INVESTIGATOR
        evals.listing_prep.suites:TEMPLATE_REPORTS
      max_usd: "0.25"
      total_max_usd: "0.40"
      regression_threshold: "0.10"
      paths: "agents/* evals/* config/* pyproject.toml uv.lock"
    secrets: inherit
